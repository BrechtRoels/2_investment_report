<!-- Chatbot Styles -->
<style>
    .chatbot-button {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        z-index: 1000;
    }

    .chatbot-button:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
    }

    .chatbot-button svg {
        width: 28px;
        height: 28px;
        fill: white;
    }

    .chatbot-button.active {
        transform: rotate(90deg);
    }

    .chatbot-container {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 380px;
        height: 500px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 999;
        animation: chatSlideUp 0.3s ease;
    }

    .chatbot-container.open {
        display: flex;
    }

    @keyframes chatSlideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chatbot-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chatbot-header-icon {
        width: 40px;
        height: 40px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .chatbot-header-icon svg {
        width: 24px;
        height: 24px;
        fill: white;
    }

    .chatbot-header-text h3 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .chatbot-header-text p {
        margin: 2px 0 0 0;
        font-size: 0.8rem;
        opacity: 0.9;
    }

    .chatbot-clear-btn {
        margin-left: auto;
        background: rgba(255,255,255,0.2);
        border: none;
        color: white;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .chatbot-clear-btn:hover {
        background: rgba(255,255,255,0.3);
    }

    .chatbot-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f9fafb;
    }

    .chat-message {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.9rem;
        line-height: 1.5;
    }

    .chat-message.bot {
        background: white;
        color: #374151;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .chat-message.user {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .chat-message.typing {
        display: flex;
        gap: 4px;
        padding: 16px 20px;
    }

    .chat-message.typing span {
        width: 8px;
        height: 8px;
        background: #667eea;
        border-radius: 50%;
        animation: chatBounce 1.4s infinite ease-in-out;
    }

    .chat-message.typing span:nth-child(1) { animation-delay: 0s; }
    .chat-message.typing span:nth-child(2) { animation-delay: 0.2s; }
    .chat-message.typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes chatBounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    .chatbot-input {
        padding: 15px 20px;
        background: white;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 10px;
    }

    .chatbot-input input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.3s ease;
    }

    .chatbot-input input:focus {
        border-color: #667eea;
    }

    .chatbot-input button {
        width: 44px;
        height: 44px;
        border: none;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
    }

    .chatbot-input button:hover {
        transform: scale(1.05);
    }

    .chatbot-input button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .chatbot-input button svg {
        width: 20px;
        height: 20px;
        fill: white;
    }

    @media (max-width: 768px) {
        .chatbot-container {
            width: calc(100% - 40px);
            right: 20px;
            bottom: 90px;
            height: 60vh;
        }

        .chatbot-button {
            bottom: 20px;
            right: 20px;
        }
    }
</style>

<!-- Chatbot Button -->
<button class="chatbot-button" id="chatbotButton" onclick="toggleChatbot()">
    <svg viewBox="0 0 24 24" id="chatIcon">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
    </svg>
    <svg viewBox="0 0 24 24" id="closeIcon" style="display: none;">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
</button>

<!-- Chatbot Container -->
<div class="chatbot-container" id="chatbotContainer">
    <div class="chatbot-header">
        <div class="chatbot-header-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>
        <div class="chatbot-header-text">
            <h3>Portfolio Assistant</h3>
            <p>Ask me about your investments</p>
        </div>
        <button class="chatbot-clear-btn" onclick="clearChatHistory()">Clear</button>
    </div>
    <div class="chatbot-messages" id="chatMessages">
        <div class="chat-message bot">
            Hello! I'm your portfolio assistant. Ask me anything about your holdings, market trends, or investment strategies.
        </div>
    </div>
    <div class="chatbot-input">
        <input type="text" id="chatInput" placeholder="Type your question..." onkeypress="handleChatKeypress(event)">
        <button onclick="sendChatMessage()" id="sendButton">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>

<!-- Chatbot JavaScript -->
<script>
    const CHAT_HISTORY_KEY = 'chatbot_history';
    const CHAT_OPEN_KEY = 'chatbot_open';

    // Load chat history from sessionStorage on page load
    function loadChatHistory() {
        const saved = sessionStorage.getItem(CHAT_HISTORY_KEY);
        if (saved) {
            try {
                const history = JSON.parse(saved);
                const messagesContainer = document.getElementById('chatMessages');
                // Clear default welcome message
                messagesContainer.innerHTML = '';
                // Restore messages
                history.forEach(msg => {
                    messagesContainer.innerHTML += `
                        <div class="chat-message ${msg.type}">${msg.content}</div>
                    `;
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (e) {
                console.error('Error loading chat history:', e);
            }
        }

        // Restore open state
        const wasOpen = sessionStorage.getItem(CHAT_OPEN_KEY);
        if (wasOpen === 'true') {
            toggleChatbot();
        }
    }

    // Save chat history to sessionStorage
    function saveChatHistory() {
        const messagesContainer = document.getElementById('chatMessages');
        const messages = messagesContainer.querySelectorAll('.chat-message:not(.typing)');
        const history = [];

        messages.forEach(msg => {
            history.push({
                type: msg.classList.contains('user') ? 'user' : 'bot',
                content: msg.innerHTML
            });
        });

        sessionStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(history));
    }

    function toggleChatbot() {
        const container = document.getElementById('chatbotContainer');
        const button = document.getElementById('chatbotButton');
        const chatIcon = document.getElementById('chatIcon');
        const closeIcon = document.getElementById('closeIcon');

        container.classList.toggle('open');
        button.classList.toggle('active');

        if (container.classList.contains('open')) {
            chatIcon.style.display = 'none';
            closeIcon.style.display = 'block';
            document.getElementById('chatInput').focus();
            sessionStorage.setItem(CHAT_OPEN_KEY, 'true');
            // Scroll to bottom when opening
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        } else {
            chatIcon.style.display = 'block';
            closeIcon.style.display = 'none';
            sessionStorage.setItem(CHAT_OPEN_KEY, 'false');
        }
    }

    function handleChatKeypress(event) {
        if (event.key === 'Enter') {
            sendChatMessage();
        }
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();

        if (!message) return;

        const messagesContainer = document.getElementById('chatMessages');

        // Add user message
        messagesContainer.innerHTML += `
            <div class="chat-message user">${escapeHtml(message)}</div>
        `;

        // Save after adding user message
        saveChatHistory();

        input.value = '';
        input.disabled = true;
        document.getElementById('sendButton').disabled = true;

        // Add typing indicator
        messagesContainer.innerHTML += `
            <div class="chat-message bot typing" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        `;

        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();

            // Remove typing indicator
            document.getElementById('typingIndicator')?.remove();

            if (data.error) {
                throw new Error(data.error);
            }

            // Add bot response
            messagesContainer.innerHTML += `
                <div class="chat-message bot">${formatChatResponse(data.response)}</div>
            `;

        } catch (error) {
            document.getElementById('typingIndicator')?.remove();
            messagesContainer.innerHTML += `
                <div class="chat-message bot">Sorry, I encountered an error. Please make sure Ollama is running and try again.</div>
            `;
        }

        // Save after adding bot response
        saveChatHistory();

        input.disabled = false;
        document.getElementById('sendButton').disabled = false;
        input.focus();
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatChatResponse(text) {
        // Convert line breaks to <br>
        text = text.replace(/\n/g, '<br>');
        // Convert **bold** to <strong>
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return text;
    }

    // Clear chat history (optional - can be called from console or add a button)
    function clearChatHistory() {
        sessionStorage.removeItem(CHAT_HISTORY_KEY);
        const messagesContainer = document.getElementById('chatMessages');
        messagesContainer.innerHTML = `
            <div class="chat-message bot">
                Hello! I'm your portfolio assistant. Ask me anything about your holdings, market trends, or investment strategies.
            </div>
        `;
        saveChatHistory();
    }

    // Load history when page loads
    document.addEventListener('DOMContentLoaded', loadChatHistory);
</script>
