<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividends - Portfolio Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Navigation */
        nav {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            font-weight: 600;
            transition: color 0.3s ease;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #667eea;
            background: #f0f4ff;
        }

        /* Header */
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        /* Dividends Table */
        .dividends-container {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .dividends-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .dividends-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
        }

        .dividend-count {
            font-size: 0.9rem;
            color: #666;
            background: #f0f4ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9fafb;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 700;
            color: #333;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.3s ease;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        td {
            padding: 20px 15px;
            color: #666;
        }

        .company-name {
            font-weight: 600;
            color: #333;
        }

        .ticker {
            font-size: 0.85rem;
            color: #666;
        }

        .price {
            font-weight: 600;
            color: #333;
        }

        .date {
            color: #666;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 100px;
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .positive {
            color: #10b981 !important;
            font-weight: 600;
        }

        .negative {
            color: #ef4444 !important;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 10px 8px;
            }

            header h1 {
                font-size: 2rem;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav>
            <div class="logo">💎 Portfolio Tracker</div>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/holdings">Holdings</a>
                <a href="/transactions">Transactions</a>
                <a href="/dividends" class="active">Dividends</a>
            </div>
        </nav>

        <!-- Header -->
        <header>
            <h1>Dividend History</h1>
            <p>Track all your dividend income</p>
        </header>

        <div id="loading" class="loading pulse">
            Loading dividends...
        </div>

        <div id="content" style="display: none;">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Dividends</div>
                    <div class="stat-value" id="totalDividends">€0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">This Year</div>
                    <div class="stat-value" id="yearDividends">€0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Last 12 Months</div>
                    <div class="stat-value" id="last12Months">€0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Payments</div>
                    <div class="stat-value" id="dividendCount">0</div>
                </div>
            </div>

            <!-- Dividends Table -->
            <div class="dividends-container">
                <div class="dividends-header">
                    <h2>All Dividends</h2>
                    <span class="dividend-count" id="tableCount">0 dividends</span>
                </div>

                <div id="dividendsTableContainer">
                    <!-- Table will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let allDividends = [];

        async function loadDividends() {
            try {
                const response = await fetch('/api/dividends');
                const data = await response.json();

                allDividends = data.dividends;

                // Calculate stats
                const totalDividends = allDividends.reduce((sum, div) => sum + div.total_dividend, 0);
                const currentYear = new Date().getFullYear();
                const yearDividends = allDividends
                    .filter(div => new Date(div.date).getFullYear() === currentYear)
                    .reduce((sum, div) => sum + div.total_dividend, 0);

                const oneYearAgo = new Date();
                oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
                const last12Months = allDividends
                    .filter(div => new Date(div.date) >= oneYearAgo)
                    .reduce((sum, div) => sum + div.total_dividend, 0);

                // Update stats
                document.getElementById('totalDividends').textContent = `€${totalDividends.toFixed(2)}`;
                document.getElementById('yearDividends').textContent = `€${yearDividends.toFixed(2)}`;
                document.getElementById('last12Months').textContent = `€${last12Months.toFixed(2)}`;
                document.getElementById('dividendCount').textContent = allDividends.length;

                renderDividends();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                console.error('Error loading dividends:', error);
                document.getElementById('loading').textContent = 'Error loading dividends';
            }
        }

        function renderDividends() {
            const container = document.getElementById('dividendsTableContainer');
            const count = document.getElementById('tableCount');

            count.textContent = `${allDividends.length} dividend${allDividends.length !== 1 ? 's' : ''}`;

            if (allDividends.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💰</div>
                        <h3>No dividends found</h3>
                        <p>Your dividend history will appear here</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Company</th>
                            <th>Ticker</th>
                            <th>Gross Amount</th>
                            <th>Taxes & Fees</th>
                            <th>Net Dividend</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${allDividends.map(div => {
                            const date = new Date(div.date).toLocaleDateString('en-US', {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            });

                            const totalTaxes = div.foreign_tax + div.collection_fee + div.withholding_tax + div.vat;

                            return `
                                <tr>
                                    <td class="date">${date}</td>
                                    <td>
                                        <div class="company-name">${div.name}</div>
                                        ${div.is_etf ? '<span class="ticker">ETF</span>' : ''}
                                    </td>
                                    <td class="ticker">${div.ticker}</td>
                                    <td class="price">€${div.gross_amount.toFixed(2)}</td>
                                    <td class="price negative">-€${totalTaxes.toFixed(2)}</td>
                                    <td class="price positive">€${div.total_dividend.toFixed(2)}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        loadDividends();
    </script>
</body>
</html>
